name: Hardening CI

on:
  push:
    branches:
      - main
      - hardening/full-audit-fixes
    paths:
      - 'optimizer/**'
      - 'tests/**'
      - '.github/workflows/**'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  static-and-unit:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: optimizer/requirements.txt
      - name: Install pinned dependencies
        run: |
          python -m pip install --disable-pip-version-check -r optimizer/requirements.txt
          python -m pip check
      - name: Compile every Python module
        run: |
          python -m compileall -q optimizer tests
      - name: Run regression and property tests
        run: python -m unittest discover -s tests -v
