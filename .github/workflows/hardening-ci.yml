name: Hardening CI

on:
  push:
    branches:
      - hardening/full-audit-fixes
    paths:
      - 'optimizer/**'
      - 'tests/**'
      - '.github/workflows/**'

permissions:
  contents: read

jobs:
  static-and-unit:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: optimizer/requirements.txt
      - name: Install pinned dependencies
        run: |
          python -m pip install --disable-pip-version-check -r optimizer/requirements.txt
          python -m pip check
      - name: Compile every Python module
        run: |
          python -m compileall -q optimizer tests
      - name: Run regression and property tests
        run: python -m unittest discover -s tests -v
